name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 静态检查
  syntax:
    name: Syntax / ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile (SyntaxWarning treated as error)
        run: |
          python -W error::SyntaxWarning -m compileall -q -f gateway main.py tests
          echo "✓ no syntax warnings"

      - name: Check all imports resolve (no circular imports)
        run: |
          python -m pip install --quiet -r requirements.txt
          python -c "import gateway.app, gateway.config, gateway.git_ops, gateway.git_proxy, gateway.github_client, gateway.models, gateway.prompt_renderer, gateway.store; print('✓ all modules importable')"

      - name: No unreachable statements after raise
        run: |
          # Guards against mis-nested except blocks where the tail logic ends up
          # after a raise (e.g. a function silently returning None on success).
          python - <<'PY'
          import ast
          from pathlib import Path

          hits = []
          for f in [Path("main.py"), *Path("gateway").rglob("*.py"), *Path("tests").rglob("*.py")]:
              tree = ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
              for node in ast.walk(tree):
                  for field in ("body", "orelse", "finalbody"):
                      block = getattr(node, field, None)
                      if not isinstance(block, list):
                          continue
                      for i, stmt in enumerate(block[:-1]):
                          if isinstance(stmt, ast.Raise):
                              hits.append(f"{f}:{stmt.lineno} -> {type(block[i + 1]).__name__} at line {block[i + 1].lineno}")

          if hits:
              for h in hits:
                  print(f"::error::statement after raise: {h}")
              raise SystemExit(1)
          print("✓ no unreachable statements after raise")
          PY

  # ---------------------------------------------------------------- 集成测试
  test:
    name: Test / ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Show git version
        run: git --version

      - name: Run test suite
        run: |
          python -m pytest tests -v --cov=gateway --cov-report=term-missing

      - name: Verify rules file parses
        run: |
          python - <<'PY'
          from pathlib import Path
          from gateway.config import RepoRuleMatcher

          m = RepoRuleMatcher(rules_file=Path("repos.txt"))
          rules = m.active_rules()
          assert rules, "repos.txt produced zero rules"
          print(f"✓ repos.txt -> {len(rules)} rule(s)")
          for r in rules:
              print(f"   {'deny ' if r.negated else 'allow'} {r.pattern}")
          PY

  # ---------------------------------------------------------------- 部署产物
  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [syntax, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env   # compose declares env_file: .env
          docker compose -f docker-compose.yml config >/dev/null && echo "✓ compose config valid"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: git-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container and hit /health
        run: |
          set -euo pipefail
          # Mirror the runtime constraints declared in docker-compose.yml:
          # read-only rootfs, writable tmpfs /tmp only, no privilege escalation.
          docker run -d --name gw \
            -p 127.0.0.1:8000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --security-opt no-new-privileges:true \
            -e GITHUB_TOKEN=dummy-token-for-smoke-test \
            -e ADMIN_TOKEN=dummy-admin-token \
            git-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "✓ /health responded after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::container did not become healthy"
              docker logs gw
              exit 1
            fi
            sleep 1
          done
          echo "--- /health ---"
          curl -fsS http://127.0.0.1:8000/health; echo
          echo "--- container logs ---"
          docker logs gw
          echo "--- runs as non-root ---"
          docker inspect -f '{{.Config.User}}' gw
          docker exec gw id

      - name: Container cleanup
        if: always()
        run: docker rm -f gw || true

  # ---------------------------------------------------------------- 部署配置
  deploy-config:
    name: Deploy assets sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required deploy files present
        run: |
          set -e
          for f in Dockerfile docker-compose.yml .dockerignore .env.example repos.txt.example \
                   DEPLOY.md deploy/git-gateway.service deploy/run_local.sh \
                   deploy/install_python.sh deploy/nginx.conf.example deploy/Caddyfile.example; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
            echo "✓ $f"
          done

      - name: .env.example covers every referenced variable
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          # A variable counts as documented whether it is active (FOO=) or
          # shown as an optional/commented sample (# FOO=).
          env_example = Path(".env.example").read_text(encoding="utf-8")
          declared = set(re.findall(r"^#?\s*([A-Z][A-Z0-9_]+)=", env_example, re.M))

          used = set()
          for py in [Path("main.py"), *Path("gateway").rglob("*.py")]:
              used |= set(re.findall(r'getenv\(\s*["\']([A-Z][A-Z0-9_]+)["\']', py.read_text(encoding="utf-8")))

          missing = sorted(used - declared)
          print(f"declared in .env.example: {sorted(declared)}")
          print(f"referenced by getenv   : {sorted(used)}")
          if missing:
              print("::error::.env.example is missing: " + ", ".join(missing))
              raise SystemExit(1)
          print("✓ every code-referenced variable is documented")
          PY

      - name: systemd unit syntax
        run: |
          command -v systemd-analyze >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq systemd; }
          # EnvironmentFile and ExecStart point at production paths absent in CI;
          # neutralize them so only the unit grammar is verified.
          sed -e 's|^EnvironmentFile=.*|Environment=PYTHONUNBUFFERED=1|' \
              -e 's|^ExecStart=.*|ExecStart=/bin/true|' \
              -e 's|^WorkingDirectory=.*|WorkingDirectory=/tmp|' \
              -e 's|^User=.*|User=root|' \
              -e 's|^Group=.*|Group=root|' \
              deploy/git-gateway.service > /tmp/gw.service
          systemd-analyze verify /tmp/gw.service && echo "✓ unit file verifies"

      - name: Shell scripts are executable and parse
        run: |
          set -e
          for s in deploy/run_local.sh deploy/install_python.sh; do
            test -x "$s" || { echo "::warning::$s is not executable"; }
            bash -n "$s" && echo "✓ $s parses"
          done
